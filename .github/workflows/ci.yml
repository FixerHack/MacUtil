name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Translations
        run: scripts/check-strings.sh
      - name: Build app
        run: scripts/build-app.sh release
      - name: Package
        run: ditto -c -k --keepParent build/MacCleaner.app MacCleaner.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacCleaner
          path: MacCleaner.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MacCleaner.zip --generate-notes
