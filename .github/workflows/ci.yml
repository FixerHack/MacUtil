name: CI

# The repository is public, so the runner minutes are free.
#
# Tags are deliberately not a trigger: releases are cut by scripts/release.sh from a Mac with
# Xcode, which is the only way to get both architectures and a real signature. A runner can
# manage neither, and a release built here would be an ad-hoc signed Apple Silicon half.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Translations
        run: scripts/check-strings.sh
      - name: Build app
        run: scripts/build-app.sh release
      - name: Package
        run: ditto -c -k --keepParent build.noindex/UniMacHub.app UniMacHub.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UniMacHub
          path: UniMacHub.zip
